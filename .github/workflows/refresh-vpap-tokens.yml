name: Refresh VPAP Tokens

on:
  schedule:
    # Run automatically every 8 hours
    - cron: "0 */8 * * *"

  # Allows manual testing from GitHub
  workflow_dispatch:

jobs:
  generate-tokens:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout VPAP repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate ingestion token
        env:
          VPAP_AUTH_SECRET: ${{ secrets.VPAP_AUTH_SECRET }}
        run: |
          TOKEN=$(python generate_token.py \
            --subject ingestion-service \
            --tenant-id vpap-pilot \
            --quiet)

          echo "::add-mask::$TOKEN"
          echo "INGESTION_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Generate enrichment token
        env:
          VPAP_AUTH_SECRET: ${{ secrets.VPAP_AUTH_SECRET }}
        run: |
          TOKEN=$(python generate_token.py \
            --subject enrichment-service \
            --tenant-id vpap-pilot \
            --quiet)

          echo "::add-mask::$TOKEN"
          echo "ENRICHMENT_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Generate policy engine token
        env:
          VPAP_AUTH_SECRET: ${{ secrets.VPAP_AUTH_SECRET }}
        run: |
          TOKEN=$(python generate_token.py \
            --subject policy-engine \
            --tenant-id vpap-pilot \
            --quiet)

          echo "::add-mask::$TOKEN"
          echo "POLICY_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Verify tokens were generated
        run: |
          if [ -z "$INGESTION_TOKEN" ]; then
            echo "Ingestion token generation failed"
            exit 1
          fi

          if [ -z "$ENRICHMENT_TOKEN" ]; then
            echo "Enrichment token generation failed"
            exit 1
          fi

          if [ -z "$POLICY_TOKEN" ]; then
            echo "Policy token generation failed"
            exit 1
          fi

          echo "All three tokens generated successfully."
